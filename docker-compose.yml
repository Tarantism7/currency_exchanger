services:
  postgres:
    image: postgres:16
    container_name: currency-db
    environment:
      POSTGRES_DB: currency_exchanger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

